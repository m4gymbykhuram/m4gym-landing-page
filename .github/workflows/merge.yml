name: Publish To Main

on:
  push:
    branches:
      - dev

concurrency:
  group: publish-dev-to-main
  cancel-in-progress: false

env:
  SOURCE_BRANCH: dev
  TARGET_BRANCH: main

jobs:
  promote-dev-to-main:
    name: Create and merge PR into main
    if: contains(github.event.head_commit.message, 'build in production')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Create or reuse pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.SOURCE_BRANCH;
            const base = process.env.TARGET_BRANCH;

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`,
            });

            if (comparison.data.ahead_by === 0) {
              core.info(`${head} is already up to date with ${base}.`);
              core.setOutput("pr_number", "");
              return;
            }

            const existingPrs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head: `${owner}:${head}`,
            });

            let pr = existingPrs.data[0];

            if (!pr) {
              pr = (
                await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `Deploy ${head} to ${base}`,
                  head,
                  base,
                  body: [
                    "Automated production publish PR.",
                    "",
                    `Triggered by commit: \`${context.sha}\``,
                  ].join("\n"),
                })
              ).data;

              core.info(`Created PR #${pr.number}.`);
            } else {
              core.info(`Reusing PR #${pr.number}.`);
            }

            core.setOutput("pr_number", String(pr.number));

      - name: Merge pull request
        if: steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = Number("${{ steps.pr.outputs.pr_number }}");

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let pr;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });

              pr = response.data;

              if (pr.merged) {
                core.info(`PR #${pull_number} is already merged.`);
                return;
              }

              if (pr.mergeable_state !== "unknown") {
                break;
              }

              await sleep(3000);
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number,
                merge_method: "merge",
              });

              core.info(`Merged PR #${pull_number}.`);
              return;
            } catch (error) {
              core.warning(`Direct merge failed: ${error.message}`);
            }

            try {
              await github.graphql(
                `
                  mutation EnableAutoMerge($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(
                      input: {
                        pullRequestId: $pullRequestId
                        mergeMethod: MERGE
                      }
                    ) {
                      pullRequest {
                        number
                      }
                    }
                  }
                `,
                {
                  pullRequestId: pr.node_id,
                },
              );

              core.info(`Enabled auto-merge for PR #${pull_number}.`);
            } catch (error) {
              core.setFailed(
                `Unable to merge PR #${pull_number} or enable auto-merge. ${error.message}`,
              );
            }
